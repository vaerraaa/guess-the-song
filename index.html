<!doctype html>
<html lang="en" data-theme="dark" data-animations="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b12">
  <meta name="description" content="Guess the Song — hear a short preview, name the track. Ten songs, ten seconds each.">
  <title>Guess the Song</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cg fill='white'%3E%3Crect x='7' y='12' width='3' height='8' rx='1.5'/%3E%3Crect x='12' y='8' width='3' height='16' rx='1.5'/%3E%3Crect x='17' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='22' y='14' width='3' height='4' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/online.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      const s = JSON.parse(localStorage.getItem('gts:settings') || '{}');
      if (s.theme) document.documentElement.dataset.theme = s.theme;
      if (s.animations === false) document.documentElement.dataset.animations = 'off';
    } catch {}
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <noscript><p class="noscript">Guess the Song needs JavaScript to play.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
